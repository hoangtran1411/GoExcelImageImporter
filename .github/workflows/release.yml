name: Release Build

on:
  push:
    tags:
      - 'v*' # Trigger on tags matching v*, e.g. v1.0.0

permissions:
  contents: write # Required to create releases

env:
  GO_VERSION: '1.25.6'
  WAILS_VERSION: 'v3.0.0-beta.16'

jobs:
  release:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        check-latest: true
        cache: true

    - name: Run Unit Tests
      run: go test -v ./internal/engine ./

    - name: Install Wails v3
      run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

    - name: Build Windows EXE
      # Build without debug symbols and inject version from tag
      run: |
        wails3 task windows:build VERSION=${{ github.ref_name }}

    - name: Rename Output
      # Rename to include version/arch for clarity
      run: |
        Move-Item build/bin/tool_chen_anh.exe build/bin/ImageToExcel-Windows-x64.exe

    - name: Create Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        files: build/bin/ImageToExcel-Windows-x64.exe
        generate_release_notes: true
        draft: false
        prerelease: false
