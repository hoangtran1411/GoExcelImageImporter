name: CI

on:
  push:
    branches: [ "main", "feature/*" ]
  pull_request:
    branches: [ "main" ]

env:
  GO_VERSION: '1.25.6'
  NODE_VERSION: '22'
  WAILS_VERSION: 'v3.0.0-beta.16'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      GOOS: windows
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v7
      with:
        version: v2.8.0
        args: --timeout=5m

  test:
    name: Test & Coverage
    runs-on: windows-latest
    needs: lint
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: Run Unit Tests with Coverage
      run: go test -v -coverprofile=coverage.out -covermode=atomic ./internal/engine ./

    - name: Upload Coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage.out
        flags: unittests
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: Check Coverage Threshold
      shell: bash
      run: |
        COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
        echo "Total coverage: ${COVERAGE}%"
        COVERAGE_INT=${COVERAGE%.*}
        if [ "$COVERAGE_INT" -lt 40 ]; then
          echo "::warning::Coverage ${COVERAGE}% is below the 40% threshold"
        fi

  build:
    name: Build Windows
    runs-on: windows-latest
    needs: test
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        check-latest: true
        cache: true

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Install Wails v3
      run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

    - name: Build Windows EXE
      run: wails3 build

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ImageToExcel-Windows-x64
        path: build/bin/tool_chen_anh.exe
